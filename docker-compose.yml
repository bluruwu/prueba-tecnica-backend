services:
  postgres_db:
    image: postgres:16-alpine
    container_name: payment_db_container
    restart: always
    environment:
      POSTGRES_USER: user_prueba
      POSTGRES_PASSWORD: password_prueba
      POSTGRES_DB: payment_db
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    # Healthcheck
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U user_prueba -d payment_db" ]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - payment_network

  payment-service:
    build: ./payment-service
    environment:
      DATABASE_URL: "postgresql://user_prueba:password_prueba@postgres_db:5432/payment_db?schema=public"
      PORT: 3001
    # 4.1
    depends_on:
      postgres_db:
        condition: service_healthy
    networks:
      - payment_network

  api-gateway:
    build: ./api-gateway
    environment:
      PORT: 3000
      PAYMENT_SERVICE_URL: "http://payment-service:3001"
      JWT_SECRET: "PRUEBA_TECNICA_SECRET_KEY"
    ports:
      - "3000:3000"
    depends_on:
      - payment-service
    networks:
      - payment_network

# 4.1
networks:
  payment_network:
    driver: bridge

volumes:
  postgres_data:
